name: post-to-x

on:
  schedule:
    # GitHub の定期実行は混雑時に数時間遅れるため、時刻指定ではなく 20 分おきに起動し、
    # slot_due.py が「今の時間帯に該当し、今日まだ投稿していない枠」を判定して動く（自己修復型）。
    # 該当枠が無いときは数秒で終了する（pip 前に判定するので Actions 分数はほぼ消費しない）。
    - cron: "*/20 * * * *"
  workflow_dispatch:        # 手動実行ボタン（スマホのGitHubアプリからも押せる）
    inputs:
      slot:
        description: "auto（時間帯から自動判定）/ morning / noon / night / evening（反応投稿）/ presale（ROOMブースト）"
        default: "auto"
      dry_run:
        description: "true なら投稿せず確認だけ"
        default: "false"

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      ROOM_URL: ${{ secrets.ROOM_URL }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_LINK_URL: ${{ vars.THREADS_LINK_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      # 標準ライブラリだけで判定（setup-python / pip の前に置いて、該当枠が無い回を数秒で終わらせる）
      - name: Decide slot
        id: slot
        run: |
          REQ="${{ github.event.inputs.slot || 'auto' }}"
          S=$(python3 slot_due.py "$REQ")
          echo "slot=$S" >> "$GITHUB_OUTPUT"
          echo "dry=${{ github.event.inputs.dry_run || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "now(JST)=$(date +'%Y-%m-%d %H:%M')  requested=$REQ  due=$S"

      - uses: actions/setup-python@v5
        if: steps.slot.outputs.slot != 'none'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.slot.outputs.slot != 'none'
        run: pip install -r requirements.txt

      - name: Check X credentials (no post)
        if: steps.slot.outputs.slot != 'none'
        run: python diag_x.py

      - name: Check Threads credentials (no post)
        if: steps.slot.outputs.slot != 'none'
        run: python diag_threads.py

      - name: Run
        if: steps.slot.outputs.slot != 'none'
        run: |
          SLOT="${{ steps.slot.outputs.slot }}"
          DRY=""
          [ "${{ steps.slot.outputs.dry }}" = "true" ] && DRY="--dry-run"
          if [ "$SLOT" = "evening" ]; then
            python main.py engage $DRY
          elif [ "$SLOT" = "presale" ]; then
            python main.py presale $DRY
          else
            python main.py run --slot $SLOT $DRY
          fi

      - name: Build blog (GitHub Pages)
        if: steps.slot.outputs.slot != 'none' && steps.slot.outputs.dry != 'true'
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/
          # Variables でも Secrets でも受け付ける
          GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION || secrets.GSC_VERIFICATION }}
          PINTEREST_VERIFICATION: ${{ vars.PINTEREST_VERIFICATION || secrets.PINTEREST_VERIFICATION }}
        run: python build_site.py

      # ブログは公開リポジトリ <ユーザー名>.github.io に書き出す（このリポジトリは Private のまま）
      - name: Publish blog to <owner>.github.io
        if: steps.slot.outputs.slot != 'none' && steps.slot.outputs.dry != 'true' && env.BLOG_PUSH_TOKEN != ''
        env:
          BLOG_PUSH_TOKEN: ${{ secrets.BLOG_PUSH_TOKEN }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.BLOG_PUSH_TOKEN }}
          external_repository: ${{ github.repository_owner }}/${{ github.repository_owner }}.github.io
          publish_branch: main
          publish_dir: ./docs
          user_name: rakuten-bot
          user_email: bot@users.noreply.github.com
          commit_message: "blog update"

      - name: Save history back to repo
        if: steps.slot.outputs.slot != 'none' && steps.slot.outputs.dry != 'true'
        run: |
          git config user.name "rakuten-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/history.json data/site_items.json data/threads_token.json output/*.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "post: ${{ steps.slot.outputs.slot }} $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase -X theirs origin main || true
          git push

      # 途中で失敗したら、スマホに「失敗」を通知する（何も来ない＝失敗、を無くす）
      - name: Notify failure
        if: failure() && env.NTFY_TOPIC != ''
        run: |
          curl -s -H "Title: 投稿ジョブ失敗（${{ steps.slot.outputs.slot }}）" -H "Priority: high" -H "Tags: x" \
            -d "GitHub Actions が失敗しました。Actions のログを確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${NTFY_TOPIC}" >/dev/null || true
